name: Release (rx/oag)

# Builds xmrig with rx/oag for Linux x64, Linux arm64 and Windows x64, runs the
# rx/oag tests on each platform, and publishes a GitHub release with the archives.
#
# Run it from the Actions tab (Run workflow, give the tag), or push a tag such as v6.26.0-oag.1.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v6.26.0-oag.1"
        required: true
      prerelease:
        description: "Mark as a pre-release"
        type: boolean
        default: false
  push:
    tags:
      - "v*-oag*"

permissions:
  contents: read

env:
  VERSION: ${{ inputs.tag || github.ref_name }}

jobs:
  linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5

      # Fully static (musl) build inside Alpine; the script also runs the rx/oag tests.
      - name: Build and test
        run: docker run --rm -v "$PWD":/src -w /src alpine:3.21 sh scripts/oag/build-linux-static.sh "$VERSION" "${{ matrix.arch }}"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  windows:
    name: Windows x64
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            git
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja

      # Miners are commonly flagged as potentially unwanted software; keep Defender
      # from quarantining the freshly built binaries on this throwaway runner.
      - name: Exclude the workspace from Defender
        shell: pwsh
        continue-on-error: true
        run: Add-MpPreference -ExclusionPath "${{ github.workspace }}"

      - name: Dependencies (xmrig-deps)
        run: git clone --depth 1 --branch v5.0 https://github.com/xmrig/xmrig-deps.git ../xmrig-deps

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DXMRIG_DEPS="$(cygpath -m "$PWD/../xmrig-deps/gcc/x64")" \
            -DWITH_OPENCL=OFF -DWITH_CUDA=OFF -DWITH_OAG_TESTS=ON
          cmake --build build
          strip build/xmrig.exe

      - name: Test
        shell: pwsh
        run: |
          ./build/xmrig-oag-test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/oag/vector_node.py build/xmrig.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./build/xmrig.exe --version

      - name: Pack
        shell: pwsh
        run: |
          $name = "xmrig-oag-$env:VERSION-windows-x64"
          New-Item -ItemType Directory -Force -Path "dist/$name" | Out-Null
          Copy-Item build/xmrig.exe, LICENSE, doc/OAG.md -Destination "dist/$name"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: Publish
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: XMRig for OAG ${{ env.VERSION }}
          prerelease: ${{ inputs.prerelease || false }}
          files: dist/*
          body: |
            XMRig 6.26.0 に、Orange (OAG) を掘るためのアルゴリズム `rx/oag` を足したものです。

            ```sh
            xmrig -o 127.0.0.1:1919 -u <自分の OAG アドレス> -a rx/oag
            ```

            | ファイル | 環境 |
            | --- | --- |
            | `xmrig-oag-${{ env.VERSION }}-linux-static-x64.tar.gz` | Linux x86-64 (完全静的、musl) |
            | `xmrig-oag-${{ env.VERSION }}-linux-static-arm64.tar.gz` | Linux aarch64 (完全静的、musl) |
            | `xmrig-oag-${{ env.VERSION }}-windows-x64.zip` | Windows x86-64 |

            - どのバイナリも、作った環境の上で Orange の `docs/STRATUM.md` §6 の検算用の値 (本番のブロック 1 と 16965) を通してから載せています。
            - CPU 専用です (GPU は `rx/oag` を掘れません)。
            - 寄付 (donate) は XMRig の既定のまま 1% です。約 100 分に 1 分、XMRig の作者のプールで Monero を掘ります。
            - 使い方と注意: 同梱の `OAG.md`。ソースはこのタグです (GPL-3.0)。
